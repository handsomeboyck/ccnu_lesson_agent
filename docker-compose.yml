# ccnu_lesson_agent 生产编排（阿里云 ECS / Docker Compose）
# 用法:
#   1) docker compose build codex-sandbox        # 构建沙箱镜像（仅构建，不运行）
#   2) docker compose up -d --build              # 启动 app / db / codex
# .env 变量说明见 server/.env.example

services:
  app:
    build: .
    image: ccnu_lesson_agent:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: "8080"
      WEB_DIST: /app/web/dist
      SKILLS_DIR: /app/skills
      UPLOAD_DIR: /app/uploads
      ARTIFACT_DIR: /app/artifacts
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD:-change-me}@db:5432/lesson_agent?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-long-random-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CODEX_URL: http://codex:9090
    volumes:
      - skills-data:/app/skills
      - uploads-data:/app/uploads
      - artifacts-data:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: lesson_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d lesson_agent"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Python 沙箱执行服务：挂 docker.sock 调度一次性容器（仅内网，不对外）
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
      target: worker
    image: ccnu_codex_worker:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CODEX_PORT: "9090"
      CODEX_SANDBOX_IMAGE: ccnu-codex:latest
      CODEX_HOST_JOBS: /opt/ccnu_codex_jobs
      CODEX_TIMEOUT_SEC: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ccnu_codex_jobs:/opt/ccnu_codex_jobs  # 宿主共享作业目录（worker 写、沙箱读）
      - /:/host:ro                                # 宿主根只读挂载（监控主机资源）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 沙箱镜像（仅构建用，见 README/部署文档）
  codex-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.codex
      target: sandbox
    image: ccnu-codex:latest
    profiles: ["tools"]

volumes:
  pgdata:
  skills-data:
  uploads-data:
  artifacts-data:
