<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4b9b"/>
      <stop offset="1" stop-color="#2f6db4"/>
    </linearGradient>
  </defs>
  <!-- 圆底 -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- 金色外环 -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c9a24b" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.2" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- 内白底 -->
  <circle cx="32" cy="32" r="21" fill="#ffffff" opacity="0.12"/>
  <!-- 华 字（宋体风，白色） -->
  <text x="32" y="40.5" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="30" font-weight="700" fill="#ffffff">华</text>
</svg>
