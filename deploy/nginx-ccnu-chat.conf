user  nobody;
worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;

    # 80 端口：ACME 验证 + 跳转 HTTPS
    server {
        listen 80;
        server_name www.ccnu.chat ccnu.chat;

        # Let's Encrypt HTTP-01 验证路径
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 443 HTTPS：反代 ccnu_lesson_agent (127.0.0.1:8080)
    server {
        listen 443 ssl http2;
        server_name www.ccnu.chat ccnu.chat;

        ssl_certificate      /ssl/www.ccnu.chat.pem;
        ssl_certificate_key  /ssl/www.ccnu.chat.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 统一反代：API(/v1) + SPA 静态 + SSE 流式都由 Go 单端口处理
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # SSE 流式关键：关闭缓冲、长超时、无 Connection 复用
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
